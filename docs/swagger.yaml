  /admin/articles:
    get:
      consumes:
      - application/json
      description: 管理员按页码分页查询所有文章，包含隐藏、公开、加密、草稿和已软删除文章；软删除文章返回 deleted_at。
      parameters:
      - description: 页码，从 1 开始
        in: query
        name: page
        type: integer
      - description: 每页数量，默认 10，最大 50
        in: query
        name: page_size
        type: integer
      - description: 是否只查询推荐文章
        in: query
        name: recommend
        type: boolean
      - description: 分类 ID
        in: query
        name: category_id
        type: integer
      - description: 标签 ID
        in: query
        name: tag_id
        type: integer
      - description: 搜索关键词，匹配标题和摘要
        in: query
        name: search
        type: string
      - description: 排序字段：created_at、updated_at、category、status、recommended；默认 updated_at
        in: query
        name: sort_by
        type: string
      - description: 排序方向：asc 或 desc，默认 desc
        in: query
        name: sort_order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 统一响应；code=0 表示查询成功，code=400 表示参数错误
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.AdminArticlePageResp'
              type: object
        "401":
          description: 未登录或 token 已过期
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: 权限不足
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 分页查询管理端文章
      tags:
      - 文章管理
    post:
      consumes:
      - application/json
      description: 管理员新增或更新文章，并同步分类、标签、音乐和推荐关系。
      parameters:
      - description: 文章保存请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ArticleSaveReq'
      produces:
      - application/json
      responses:
        "200":
          description: 统一响应；code=0 表示保存成功，code=400 表示参数错误或业务错误
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.ArticleDetailResp'
              type: object
        "401":
          description: 未登录或 token 已过期
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: 权限不足
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: 文章不存在
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 新增或更新文章
      tags:
      - 文章管理
