info:
  contact: {}
  description: 个人博客后端 API 服务，所有业务接口均使用统一响应结构。
  title: Blog Backend API
  version: "1.0"
paths:
  /admin/analytics/backfill:
    post:
      consumes:
      - application/json
      description: 对指定闭区间逐日重算统计聚合，适用于统计规则调整后的历史补算。
      parameters:
      - description: 起始日期 YYYY-MM-DD
        in: query
        name: from
        required: true
        type: string
      - description: 结束日期 YYYY-MM-DD
        in: query
        name: to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 统一响应；code=0 成功，code=400 参数错误
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/analytics.BackfillResult'
              type: object
        "401":
          description: 未登录或 token 已过期
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: 权限不足
          schema:
            $ref: '#/definitions/response.Response'
        "429":
          description: 请求过于频繁
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 回填日聚合
      tags:
      - analytics
  /admin/analytics/dimensions:
