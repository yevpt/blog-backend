        required: true
        type: string
      - description: 起始日期 YYYY-MM-DD，默认近 7 天
        in: query
        name: from
        type: string
      - description: 结束日期 YYYY-MM-DD，默认今天
        in: query
        name: to
        type: string
      produces:
