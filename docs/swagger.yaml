  /oauth/{source}/authorize:
    get:
      consumes:
      - application/json
      description: action=login 表示第三方登录；action=bind 表示绑定到当前登录用户，绑定动作必须携带 access token。
      parameters:
      - description: 平台标识，如 github
        in: path
        name: source
        required: true
        type: string
      - description: 授权动作：login 或 bind
        in: query
        name: action
        required: true
        type: string
      - description: 前端回跳地址
        in: query
        name: redirect_uri
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 授权地址创建成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.OAuthAuthorizeResp'
              type: object
        "401":
          description: 绑定动作未登录
          schema:
            $ref: '#/definitions/response.Response'
      summary: 创建第三方授权地址
      tags:
      - 第三方登录
  /oauth/{source}/callback:
    get:
      consumes:
      - application/json
      description: 校验一次性 state，使用 code 换取第三方 token，再完成登录或绑定。
      parameters:
      - description: 平台标识，如 github
        in: path
        name: source
        required: true
        type: string
      - description: 第三方授权码
        in: query
        name: code
        required: true
        type: string
      - description: 后端生成的一次性 state
        in: query
        name: state
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: callback 处理成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.OAuthCallbackResp'
              type: object
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 处理第三方登录回调
      tags:
      - 第三方登录
