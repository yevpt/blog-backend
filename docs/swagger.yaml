      description: 登录用户上传临时图片。默认 scene=article，仅支持 images/covers；scene=comment 用于留言、评论、回复图片，仅支持
        images，普通图片最大 1MB 并压缩到 500KB 内，GIF 最大 300KB。
      parameters:
      - description: 上传场景：article 或 comment；默认 article
        in: formData
        name: scene
        type: string
      - description: 临时目录：images 或 covers
        in: formData
        name: dir
        required: true
        type: string
      - description: 图片文件；article 最大 10MB，comment 普通图片最大 1MB、GIF 最大 300KB
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: 统一响应；code=0 表示上传成功，code=400 表示参数错误或业务错误
