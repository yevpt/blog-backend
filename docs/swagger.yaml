        传新图片文件，图片会整体替换。
      parameters:
      - description: 碎语 ID；为空表示新增
        in: formData
        name: id
        type: integer
      - description: 作者用户 ID；仅管理员可代管
        in: formData
        name: user_id
        type: integer
      - description: 碎语正文
        in: formData
        name: content
        required: true
        type: string
      - description: 状态：0 隐藏，1 公开
        in: formData
        name: status
        required: true
        type: integer
      - description: 评论状态：0 关闭，1 开启
        in: formData
        name: comment_status
        required: true
        type: integer
      - collectionFormat: csv
        description: 已上传图片对象 key 或 URL，可重复传入
        in: formData
        items:
          type: string
        name: image_urls
        type: array
      - collectionFormat: csv
        description: 图片顺序引用，可重复传入；url:N 指向第 N 个 image_urls，file:N 指向第 N 个 images
        in: formData
        items:
          type: string
