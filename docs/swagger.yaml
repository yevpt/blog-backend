        required: true
        schema:
          $ref: '#/definitions/dto.PasswordResetCodeReq'
      produces:
      - application/json
      responses:
        "200":
          description: 统一响应；code=0 表示请求已受理，code=400 表示参数错误或业务错误
          schema:
            $ref: '#/definitions/response.Response'
        "429":
          description: 发送频率超限
          schema:
            $ref: '#/definitions/response.Response'
      summary: 发送忘记密码验证码
      tags:
      - 认证
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: 使用 refresh token 换发新的 access token 和 refresh token；旧 refresh token
        会在业务层失效。
      parameters:
      - description: 刷新令牌请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshReq'
      produces:
      - application/json
      responses:
        "200":
          description: 刷新成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.TokenResp'
              type: object
        "401":
          description: refresh token 非法、过期或类型不匹配
          schema:
            $ref: '#/definitions/response.Response'
      summary: 刷新令牌
      tags:
      - 认证
  /auth/register:
    post:
      consumes:
      - multipart/form-data
      description: 使用邮箱、密码和验证码创建用户；可选上传头像（JPG、PNG、WebP，原始最大 2MB，不支持 GIF）。注册成功返回与登录相同的双
        token 与用户信息。
      parameters:
      - description: 邮箱
        in: formData
        name: email
        required: true
        type: string
      - description: 密码（至少 8 位）
        in: formData
        name: password
        required: true
        type: string
      - description: 6 位邮箱验证码
        in: formData
        name: code
        required: true
        type: string
      - description: 昵称
        in: formData
        name: nickname
        type: string
      - description: 可选头像图片
        in: formData
        name: avatar
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: 统一响应；code=0 表示注册成功并已登录，code=400 表示参数错误或业务错误
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.LoginResp'
              type: object
      summary: 邮箱注册
      tags:
      - 认证
  /auth/send-code:
    post:
      consumes:
      - application/json
      description: 消费 GoCaptcha 一次性票据后向指定邮箱发送注册验证码；参数错误或普通业务错误通过统一响应 code 表达，发送频率超限时返回
        HTTP 429。
      parameters:
      - description: 发送验证码请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SendCodeReq'
      produces:
      - application/json
      responses:
        "200":
          description: 统一响应；code=0 表示发送成功，code=400 表示参数错误或业务错误
          schema:
            $ref: '#/definitions/response.Response'
        "429":
          description: 发送频率超限
          schema:
            $ref: '#/definitions/response.Response'
      summary: 发送邮箱验证码
      tags:
      - 认证
  /captcha/register/challenge:
    post:
      consumes:
      - application/json
      description: 返回 GoCaptcha 滑块主图、滑块图和挑战 ID；后端只保存答案，不向前端暴露目标 X 坐标。
      produces:
      - application/json
      responses:
        "200":
          description: 生成成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.CaptchaChallengeResp'
              type: object
        "500":
          description: 生成失败
          schema:
            $ref: '#/definitions/response.Response'
      summary: 生成注册图形验证码
      tags:
      - 图形验证码
  /captcha/register/verify:
    post:
      consumes:
      - application/json
      description: 校验通过后返回短期一次性 captcha_token，用于 /auth/send-code。
      parameters:
      - description: 图形验证码校验请求
        in: body
        name: request
        required: true
