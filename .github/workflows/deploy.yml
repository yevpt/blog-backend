name: CI/CD

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

# 容器仓库配置从 GitHub Repository Variables / Secrets 注入，
# 避免把云厂商地址、账号和镜像路径写死在 workflow 中。
env:
  REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
  IMAGE_NAME: ${{ vars.CONTAINER_IMAGE }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 复用 Dockerfile 的 test stage，保证测试环境与最终镜像构建环境一致。
      - name: Run tests in builder image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  image:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    outputs:
      image: ${{ env.IMAGE_NAME }}
      tag: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 发布镜像前先检查必需配置，缺失时给出明确错误，避免 Docker 登录阶段才暴露空值。
      - name: Check image publish config
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$REGISTRY" ] || [ -z "$IMAGE_NAME" ]; then
            echo "缺少 GitHub Variables：CONTAINER_REGISTRY 或 CONTAINER_IMAGE。"
            exit 1
          fi
          if [ -z "$REGISTRY_USERNAME" ] || [ -z "$REGISTRY_PASSWORD" ]; then
            echo "缺少 GitHub Secrets：REGISTRY_USERNAME 或 REGISTRY_PASSWORD。"
            exit 1
          fi

      # 登录目标镜像仓库；账号和密码仅从 Secrets 读取，不落入仓库文件。
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # 同时推送 latest 和 commit SHA；部署阶段固定使用 SHA，避免漂移。
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: image
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    env:
      DEPLOY_TARGET: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      APP_ENV_NAME: ${{ github.ref == 'refs/heads/main' && 'prod' || 'test' }}
      CONFIG_OVERLAY: ${{ github.ref == 'refs/heads/main' && 'config.prod.yaml' || 'config.test.yaml' }}
      CONTAINER_NAME: ${{ github.ref == 'refs/heads/main' && 'blog-server' || 'blog-server-test' }}
      REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
      REMOTE_USER: ${{ secrets.REMOTE_USER }}
      REMOTE_PORT: ${{ vars.REMOTE_PORT }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
      IMAGE_REF: ${{ needs.image.outputs.image }}:${{ needs.image.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 写入临时 SSH key 并预置 known_hosts，后续 scp/ssh 全部复用该连接配置。
      - name: Prepare SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          REMOTE_PORT="${REMOTE_PORT:-22}"
          ssh-keyscan -p "$REMOTE_PORT" "$REMOTE_HOST" >> ~/.ssh/known_hosts

      # 同步 compose 文件和公开配置；私密环境变量仍保留在服务器 .env 中。
      - name: Sync compose and public config
        run: |
          set -euo pipefail
          REMOTE_PORT="${REMOTE_PORT:-22}"
          DEPLOY_DIR="${DEPLOY_DIR:-/opt/blog-backend}"
          ssh -i ~/.ssh/deploy_key -p "$REMOTE_PORT" "$REMOTE_USER@$REMOTE_HOST" \
            "mkdir -p '$DEPLOY_DIR/config'"
          scp -i ~/.ssh/deploy_key -P "$REMOTE_PORT" docker-compose.yml \
            "$REMOTE_USER@$REMOTE_HOST:$DEPLOY_DIR/docker-compose.yml"
          scp -i ~/.ssh/deploy_key -P "$REMOTE_PORT" "config/config.yaml" "config/$CONFIG_OVERLAY" \
            "$REMOTE_USER@$REMOTE_HOST:$DEPLOY_DIR/config/"

      # 远程服务器只负责拉取指定 SHA 镜像并重启服务，避免在服务器上构建。
      - name: Deploy with Docker Compose
        run: |
          set -euo pipefail
          REMOTE_PORT="${REMOTE_PORT:-22}"
          DEPLOY_DIR="${DEPLOY_DIR:-/opt/blog-backend}"
          ssh -i ~/.ssh/deploy_key -p "$REMOTE_PORT" "$REMOTE_USER@$REMOTE_HOST" \
            "DEPLOY_DIR='$DEPLOY_DIR' \
             IMAGE_REF='$IMAGE_REF' \
             APP_ENV_NAME='$APP_ENV_NAME' \
             CONTAINER_NAME='$CONTAINER_NAME' \
             DEPLOY_TARGET='$DEPLOY_TARGET' \
             REGISTRY='${{ env.REGISTRY }}' \
             REGISTRY_USERNAME='${{ secrets.REGISTRY_USERNAME }}' \
             REGISTRY_PASSWORD='${{ secrets.REGISTRY_PASSWORD }}' \
             bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_DIR"

          if [ ! -f .env ]; then
            echo "缺少 $DEPLOY_DIR/.env，请先在服务器创建 ${DEPLOY_TARGET} 环境变量文件。"
            exit 1
          fi

          # 镜像地址按 commit SHA 内联注入，compose 自动读取同目录 .env 中的密钥
          export BLOG_SERVER_IMAGE="$IMAGE_REF"
          export APP_ENV="$APP_ENV_NAME"
          export COMPOSE_CONTAINER_NAME="$CONTAINER_NAME"
          printf '%s\n' "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin
          docker compose pull blog-server
          # 正常 up；若因历史遗留容器（旧 compose 项目名）占用固定 container_name 而冲突，
          # 强制移除同名散落容器后重试一次，避免人工 SSH 清理
          if ! docker compose up -d --remove-orphans blog-server; then
            echo "up 失败，移除同名遗留容器后重试…"
            docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
            docker compose up -d --remove-orphans blog-server
          fi
          docker compose ps blog-server
          docker image prune -f
          REMOTE
