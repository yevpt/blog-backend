# 博客后端 API 服务
# MySQL 和 Redis 由宝塔管理，此处只跑 blog-server
# 部署目录扁平结构：docker-compose.yml / config/ / .env 同级
# 首次使用：cp .env.example .env 并填写密钥，之后 docker compose up -d 即可

name: blog-backend

services:
  blog-server:
    # 生产由 CI/部署经 BLOG_SERVER_IMAGE 注入精确镜像；下方仅占位，请替换为你的镜像仓
    image: ${BLOG_SERVER_IMAGE:-your-registry.example.com/blog-backend:latest}
    container_name: ${COMPOSE_CONTAINER_NAME:-blog-server}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-prod}
      # 宝塔管理的 MySQL 连接信息
      BLOG_DB_HOST: ${DB_HOST:-localhost}
      BLOG_DB_PORT: ${DB_PORT:-3306}
      BLOG_DB_NAME: ${DB_NAME:-blog_prod}
      BLOG_DB_USER: ${DB_USER:-blog}
      BLOG_DB_PASSWORD: ${DB_PASSWORD:-}
      # 宝塔管理的 Redis 连接信息
      BLOG_REDIS_ADDR: ${REDIS_HOST:-localhost}:${REDIS_PORT:-6379}
      BLOG_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # 其他配置
      BLOG_JWT_SECRET: ${JWT_SECRET:-}
      BLOG_GARAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      BLOG_GARAGE_BUCKET: ${STORAGE_BUCKET:-}
      BLOG_GARAGE_REGION: ${STORAGE_REGION:-}
      BLOG_GARAGE_ACCESSKEYID: ${STORAGE_ACCESS_KEY:-}
      BLOG_GARAGE_SECRETACCESSKEY: ${STORAGE_SECRET_KEY:-}
      BLOG_GARAGE_CDN: ${STORAGE_CDN:-false}
      BLOG_CDN_HOST: ${CDN_HOST:-}
      BLOG_CDN_SECRET: ${CDN_SECRET:-}
      BLOG_CDN_SIGN_QUERY_NAME: ${CDN_SIGN_QUERY_NAME:-a}
      BLOG_CDN_TIMESTAMP_QUERY_NAME: ${CDN_TIMESTAMP_QUERY_NAME:-b}
      # 站点统计：允许的上报来源、地理库路径、IP 哈希盐、collect 反伪造 token secret
      ANALYTICS_ALLOWED_ORIGINS: ${ANALYTICS_ALLOWED_ORIGINS:-}
      BLOG_ANALYTICS_GEOIP_PATH: ${ANALYTICS_GEOIP_PATH:-}
      BLOG_ANALYTICS_IP_SALT: ${ANALYTICS_IP_SALT:-}
      # 站点主域名（apex），用于 referer 内/外链判定
      BLOG_ANALYTICS_SITE_HOST: ${ANALYTICS_SITE_HOST:-}
      # 须与前端 ANALYTICS_COLLECT_TOKEN_SECRET 同值；留空则关闭 token 校验
      BLOG_ANALYTICS_COLLECT_TOKEN_SECRET: ${ANALYTICS_COLLECT_TOKEN_SECRET:-}
    volumes:
      - ./config:/app/config:ro
      # 地理解析库目录（放 ip2region.xdb），并把 geoip_path 设为 /app/geoip/ip2region.xdb
      - ./geoip:/app/geoip:ro
    ports:
      - "${SERVER_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
