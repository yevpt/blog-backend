# 测试环境配置（APP_ENV=test 时加载）
# 密码等敏感信息通过 .env 文件注入为环境变量（BLOG_DB_PASSWORD 等），不写在此处

server:
  mode: debug

log:
  level: debug
  format: console

moderation:
  # 测试环境执行真实策略；有效规则集由审核核心数据迁移负责初始化
  enabled: true
  mode: enforce
  rules:
    max_pattern_chars: 500
    max_keyword_rules: 500000
    max_enabled_regex_rules: 200
    max_import_rows: 200000
    max_import_file_mb: 50
    max_rule_matches_per_content: 128
    max_index_memory_mb: 512
    max_build_peak_memory_mb: 1024
    index_build_timeout: 10m
    candidate_cache_ttl: 10m
    import_artifact_retention_days: 7
    ruleset_artifact_retention_days: 7
    import_history_retention_days: 30
    require_non_empty_in_enforce: true
  migration:
    batch_size: 100

analytics:
  timezone: "Asia/Shanghai"
  retention_days: 90
  online_window: 90s
  session_timeout: 30m
  bounce_duration: 10s
  channel_buffer: 4096
  public_cache_ttl: 60s
  geoip_v4_path: ""
  geoip_v6_path: ""
  site_host: "example.com"
  ip_salt: "change_me"
  collect_token_secret: ""
  collect_token_ttl: 5m
