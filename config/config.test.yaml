# 测试环境配置（APP_ENV=test 时加载）
# 密码等敏感信息通过 .env 文件注入为环境变量（BLOG_DB_PASSWORD 等），不写在此处

server:
  mode: debug

log:
  level: debug
  format: console

moderation:
  # 测试环境执行真实策略；有效规则集由审核核心数据迁移负责初始化
  enabled: true
  mode: enforce
  migration:
    batch_size: 100

analytics:
  timezone: "Asia/Shanghai"
  retention_days: 90
  online_window: 90s
  session_timeout: 30m
  bounce_duration: 10s
  channel_buffer: 4096
  public_cache_ttl: 60s
  geoip_v4_path: ""
  geoip_v6_path: ""
  site_host: "example.com"
  ip_salt: "change_me"
  collect_token_secret: ""
  collect_token_ttl: 5m
