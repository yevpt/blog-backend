# 公共基础配置 —— 所有环境共享，不含任何敏感信息
# 优先级最低，会被 config.{env}.yaml 和 config.local.yaml 覆盖

server:
  port: 8080
  # debug 模式输出详细日志，生产环境应设为 release
  mode: debug

log:
  level: info
  # json 输出方便日志收集，console 输出方便本地开发阅读
  format: console

jwt:
  # 签名密钥，生产环境必须通过环境变量 BLOG_JWT_SECRET 覆盖
  secret: "change-me-in-production"
  expire_hours: 2
  refresh_expire_hours: 168

db:
  max_open_conns: 10
  max_idle_conns: 5
  max_lifetime_minutes: 30

redis:
  db: 0
  password: ""

garage:
  # Garage S3 兼容接口地址，例如 http://garage.example.com
  endpoint: ""
  bucket: ""
  region: ""
  accessKeyID: ""
  secretAccessKey: ""
  # 是否优先返回 CDN 私有签名 URL；关闭时返回 Garage S3 预签名 URL
  cdn: false

cdn:
  # CDN 访问域名，例如 https://blog-oss.example.com
  host: ""
  secret: ""
  signQueryName: "a"
  timestampQueryName: "b"

image:
  # CDN 回源请求头 X-Origin-Auth 密钥，生产经 env BLOG_IMAGE_ORIGINAUTHSECRET 覆盖
  originAuthSecret: ""
  # Cache-Control max-age 秒数，默认 7 天
  responseCacheMaxAge: 604800
  defaultQuality: 75
  maxWidth: 3840

email:
  # 发件人昵称，出现在邮件 From 头，如 "YEVPT <noreply@example.com>"；为空时仅显示邮箱
  from_name: ""
  # 站点公网访问前缀，用于通知邮件中的跳转链接，如 https://www.example.com
  # 未配置时邮件正文不带可点击链接，且底部 Footer 退化为纯文本
  site_url: ""
  # 邮件供应商标识，仅用于日志与发送记录归类
  provider: aliyun_enterprise
  # 供应商标称每日上限，仅作保护参考，不作为实际发送目标
  provider_daily_hard_limit: 2000
  # 站点每日真实安全上限，低于供应商上限以规避风控
  site_daily_safe_limit: 300
  # 发送频率上限：每分钟与每小时
  max_per_minute: 5
  max_per_hour: 80
  # 单封邮件之间的最小间隔秒数
  send_interval_seconds: 12
  # 是否启动通知后台 worker（dispatcher/sender）与邮件聚合 planner
  worker_enabled: true
  planner_enabled: true
  # worker 单次领取任务数量
  worker_batch_size: 20
  # worker 任务租约秒数，超期后任务可被其他实例重新领取
  lease_seconds: 300

moderation:
  # 审核总开关；全量上线前生产可临时设为 false，恢复旧版 UGC 写入行为
  enabled: true
  # enforce 实际执行审核决策；observe 仅用于本地规则调试
  mode: enforce

  review_email:
    enabled: true
    recipient_user_id: 1
    aggregation_window_seconds: 60
    min_interval_seconds: 1800
    poll_interval_seconds: 15

  # 不同用户等级在各风险场景下的处理动作
  policy:
    new:
      clean_low: post_review
      unapproved_image: pre_review
      external_link_or_ad: pre_review
      medium: pre_review
      high: block
    normal:
      clean_low: post_review
      unapproved_image: post_review
      external_link_or_ad: post_review
      medium: pre_review
      high: block
    trusted:
      clean_low: auto_approve
      unapproved_image: post_review
      external_link_or_ad: pre_review
      medium: pre_review
      high: block
    restricted:
      clean_low: pre_review
      unapproved_image: pre_review
      external_link_or_ad: pre_review
      medium: pre_review
      high: block

  rules:
    max_pattern_chars: 500
    max_keyword_rules: 500000
    max_enabled_regex_rules: 200
    max_import_rows: 200000
    max_import_file_mb: 50
    max_rule_matches_per_content: 128
    max_index_memory_mb: 512
    max_build_peak_memory_mb: 1024
    index_build_timeout: 10m
    candidate_cache_ttl: 10m
    import_artifact_retention_days: 7
    ruleset_artifact_retention_days: 7
    import_history_retention_days: 30
    require_non_empty_in_enforce: true

  content:
    moment_max_chars: 800
    comment_max_chars: 2000
    guestbook_max_chars: 2000
    reply_max_chars: 2000
    max_images_per_content: 9
    max_links_per_content: 10

  # 人工审核队列与公开理由边界
  review:
    queue_default_page_size: 20
    queue_max_page_size: 100
    reason_max_chars: 1000

  # Media & Review 阶段使用的图片处理边界
  image:
    max_upload_bytes: 1048576
    max_gif_bytes: 307200
    max_stored_bytes: 512000
    max_pixels: 12000000
    processing_concurrency: 2
    preview_max_edge: 48
    static_placeholder_key: "system/moderation/image-review.jpg"
    gif_placeholder_key: "system/moderation/gif-review.jpg"
    approval_retention_days: 90
    temp_retention: 24h
    orphan_min_age: 24h
    cleanup_interval: 24h
    cleanup_batch_size: 500

  # Governance & Operations 阶段使用的等级与计分门槛
  governance:
    new_to_normal:
      min_age_days: 7
      clean_approvals: 3
    normal_to_trusted:
      min_age_days: 30
      clean_approvals: 20
    restricted_score_threshold: 6
    restricted_duration: 168h
    # 每次干净通过抵消的违规分，避免一次轻微修正永久阻断晋升
    clean_approval_score_decay: 1
    violation_weights:
      corrected: 1
      rejected: 3
      high_risk_blocked: 5

  rate_limit:
    publish_per_minute: 10
    edit_per_minute: 10
    temp_upload_per_minute: 10

  # Governance & Operations 阶段使用的全站控制默认值
  control:
    default_registration_mode: open
    default_publishing_mode: open
    user_hide_batch_size: 200
    user_hide_max_items_per_request: 1000

  audit:
    attempt_retention_days: 90
    action_log_retention_days: 90
    # 不清理当前物化、最后通过或待审版本
    obsolete_revision_retention_days: 90
    cleanup_interval: 24h
    cleanup_batch_size: 500

  # 一次性历史审核迁移默认批次，可由 CLI --batch-size 覆盖
  migration:
    batch_size: 200

  notices:
    approved: "发布成功。"
    low_submitted: "发布成功，内容会被审核。"
    review_required: "内容已提交，等待人工审核。"
    high_rejected: "内容存在较高风险，未能发布，请修改后重试。"

analytics:
  # 切天时区，统计聚合与在线判定均按此时区计算
  timezone: "Asia/Shanghai"
  # 原始事件保留天数，超期由调度器清理
  retention_days: 90
  # 在线判定窗口，超过该时长无心跳视为离线
  online_window: 90s
  # 会话超时时长，超过则归为新会话
  session_timeout: 30m
  # 跳出判定停留阈值，停留低于该时长记为跳出
  bounce_duration: 10s
  # 异步落库 channel 缓冲大小
  channel_buffer: 4096
  # 公开统计接口缓存 TTL
  public_cache_ttl: 60s
  # 容器内 ip2region IPv4/IPv6 xdb 路径，空则关闭对应版本地理解析
  geoip_v4_path: ""
  geoip_v6_path: ""
  # 站点主域名（apex 顶级域，如 example.com），用于 referer 内/外链判定；
  # 后缀匹配会自动覆盖所有子域名（www.* 等），故只填顶级域、勿填 www。
  # 生产经 env BLOG_ANALYTICS_SITE_HOST 注入；留空则不识别内链（内部来源会被判为 external，不影响其他功能）。
  site_host: ""
  # IP 哈希盐，生产用随机串经 env BLOG_ANALYTICS_IP_SALT 覆盖
  ip_salt: "change_me"
  collect_token_secret: ""
  # collect token 有效期上界：后端拒绝 exp 超过 now+该值 的 token。
  # 必须 >= 前端 ANALYTICS_COLLECT_TOKEN_TTL_MS（前端默认 5m/300000）。
  # 此处特意比前端多 1m 作时钟偏差余量：前端签 now+5m，后端放行到 now+6m，
  # 跨宿主机时钟略有偏差也不会误拒真实 token（前端每 4m 自动刷新，安全性不受影响）。
  collect_token_ttl: 6m

oauth:
  # state 同时承载 CSRF 防护和 PKCE verifier 关联，过期后 callback 会被拒绝
  state_ttl_minutes: 10
  providers:
    github:
      enabled: false
      client_id: ""
      client_secret: ""
      redirect_uri: ""
      scopes:
        - "read:user"
        - "user:email"
      auth_url: "https://github.com/login/oauth/authorize"
      token_url: "https://github.com/login/oauth/access_token"
      user_url: "https://api.github.com/user"
      # bridge_url + bridge_secret 同时配置后 bridge_mode 才生效；未配置时恒为本机直连
      bridge_url: ""
      bridge_secret: ""
      bridge_mode: "direct"   # direct | fallback | bridge_only
    gitee:
      enabled: false
      client_id: ""
      client_secret: ""
      redirect_uri: ""
      scopes:
        - "user_info"
        - "emails"
      auth_url: "https://gitee.com/oauth/authorize"
      token_url: "https://gitee.com/oauth/token"
      user_url: "https://gitee.com/api/v5/user"
    qq:
      enabled: false
      client_id: ""
      client_secret: ""
      redirect_uri: ""
      scopes:
        - "get_user_info"
      auth_url: "https://graph.qq.com/oauth2.0/authorize"
      token_url: "https://graph.qq.com/oauth2.0/token"
      openid_url: "https://graph.qq.com/oauth2.0/me"
      user_url: "https://graph.qq.com/user/get_user_info"
    weibo:
      enabled: false
      client_id: ""
      client_secret: ""
      redirect_uri: ""
      scopes: []
      auth_url: "https://api.weibo.com/oauth2/authorize"
      token_url: "https://api.weibo.com/oauth2/access_token"
      user_url: "https://api.weibo.com/2/users/show.json"
    baidu:
      enabled: false
      client_id: ""
      client_secret: ""
      redirect_uri: ""
      scopes:
        - "basic"
      auth_url: "https://openapi.baidu.com/oauth/2.0/authorize"
      token_url: "https://openapi.baidu.com/oauth/2.0/token"
      user_url: "https://openapi.baidu.com/rest/2.0/passport/users/getInfo"
