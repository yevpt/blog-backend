# 生产环境配置（APP_ENV=prod 时加载）
# 密码等敏感信息通过 .env 文件注入为环境变量（BLOG_DB_PASSWORD 等），不写在此处

server:
  mode: release

log:
  level: info
  format: json

moderation:
  # 审核全量上线前临时关闭；上线时改回 true 并重新部署
  enabled: false
  mode: enforce
  migration:
    batch_size: 200

analytics:
  # 生产容器内 ip2region IPv4/IPv6 xdb 路径，可经 env 覆盖；为空则关闭对应版本地理解析
  geoip_v4_path: "/app/geoip/ip2region_v4.xdb"
  geoip_v6_path: "/app/geoip/ip2region_v6.xdb"
  # IP 哈希盐必须经 env BLOG_ANALYTICS_IP_SALT 注入随机串，此处占位值仅兜底
  ip_salt: "change_me"
  collect_token_secret: ""
  # 须 >= 前端 ANALYTICS_COLLECT_TOKEN_TTL_MS（前端默认 5m），此处多 1m 作时钟偏差余量。详见 config.yaml 注释。
  collect_token_ttl: 6m
